version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ym_bot_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-yandex_music_bot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bot_network

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: ym_bot_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bot_network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ym_bot
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      YANDEX_TOKEN: ${YANDEX_TOKEN}
      DB_TYPE: ${DB_TYPE:-postgresql}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${POSTGRES_DB:-yandex_music_bot}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAINTENANCE_MODE: ${MAINTENANCE_MODE:-false}
      ADMIN_IDS: ${ADMIN_IDS:-}
      MINIAPP_URL: ${MINIAPP_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bot_network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: miniapp/Dockerfile
    container_name: ym_bot_api
    environment:
      YANDEX_TOKEN: ${YANDEX_TOKEN}
      DB_TYPE: ${DB_TYPE:-postgresql}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${POSTGRES_DB:-yandex_music_bot}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MINIAPP_API_PORT: ${MINIAPP_API_PORT:-8000}
      MINIAPP_API_HOST: ${MINIAPP_API_HOST:-0.0.0.0}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bot_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: ym_bot_nginx
    ports:
      - "80:80"
      - "443:443"  # HTTPS порт (для стейджа/прода с SSL)
    volumes:
      - ./miniapp/static:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Раскомментируйте для использования SSL (после генерации сертификата)
      # - /etc/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - bot
      - api
    networks:
      - bot_network
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:

networks:
  bot_network:
    driver: bridge

